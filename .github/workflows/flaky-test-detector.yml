name: 'Debug esbuild strictness'
on:
  workflow_dispatch:

jobs:
  esbuild-strictness:
    name: 'esbuild strictness (Node ${{ matrix.node }})'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20.19, 22, 24, 26]
    steps:
      - name: Check out investigation branch
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.9

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'yarn'

      - name: Install repository dependencies
        run: yarn install --ignore-engines --frozen-lockfile

      - name: Build and pack local dependencies
        run: |
          yarn build:dev:filter @sentry/core
          yarn --cwd packages/core build:tarball
          yarn build:dev:filter @sentry/bundler-plugins
          yarn --cwd packages/bundler-plugins build:tarball

      - name: Install esbuild fixture dependencies
        working-directory: dev-packages/bundler-plugin-integration-tests/fixtures/esbuild
        run: pnpm install --force

      - name: Build strictness fixtures
        working-directory: dev-packages/bundler-plugin-integration-tests/fixtures/esbuild
        run: node cjs-directives.config.js

      - name: Print environment and generated bundles
        working-directory: dev-packages/bundler-plugin-integration-tests/fixtures/esbuild
        run: |
          node -p 'JSON.stringify({ version: process.version, execArgv: process.execArgv, nodeOptions: process.env.NODE_OPTIONS })'
          sed -n '1,120p' out/cjs-directives/baseline/strict.cjs
          sed -n '1,120p' out/cjs-directives/baseline/sloppy.cjs
          sed -n '1,120p' out/cjs-directives/static-injection/strict.cjs
          sed -n '1,120p' out/cjs-directives/static-injection/sloppy.cjs
          sed -n '1,160p' out/cjs-directives/debug-id-injection/strict.cjs
          sed -n '1,160p' out/cjs-directives/debug-id-injection/sloppy.cjs

      - name: Execute generated bundles
        working-directory: dev-packages/bundler-plugin-integration-tests/fixtures/esbuild
        run: |
          node out/cjs-directives/baseline/strict.cjs
          node out/cjs-directives/baseline/sloppy.cjs
          node out/cjs-directives/static-injection/strict.cjs
          node out/cjs-directives/static-injection/sloppy.cjs
          node out/cjs-directives/debug-id-injection/strict.cjs
          node out/cjs-directives/debug-id-injection/sloppy.cjs

      - name: Upload generated bundles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: esbuild-strictness-node-${{ matrix.node }}
          path: dev-packages/bundler-plugin-integration-tests/fixtures/esbuild/out/cjs-directives
          retention-days: 2
